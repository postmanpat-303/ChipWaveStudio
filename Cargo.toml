[package]
name = "chipwave"
version = "0.2.12+fix.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ChipWave Studio - an OctaMED-inspired tracker with a built-in synth"
repository = "https://github.com/postmanpat-303/ChipWaveStudio"
homepage = "https://postmanpat-303.github.io/ChipWaveStudio/"

[[bin]]
name = "chipwave"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "links"] }
cpal = "0.18"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
rfd = "0.17"
rtrb = "0.4"
mp3lame-encoder = "0.2.5"
id3 = "1.17"
midir = "0.11.1"
ureq = "3"
serde_json = "1"
png = "0.18"
clap-sys = "0.5"
vst3 = "0.3"
libloading = "0.9"
base64 = "0.22"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1"
sevenz-rust2 = { version = "0.24", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[target."cfg(windows)".dependencies]
# fast maths instead of the slow mingw/msvcrt ones (src/winmath.rs)
libm = "0.2.16"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet", "Win32_Security"] }
