[package]
name = "chipwave"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ChipWave Tracker - an OctaMED-inspired tracker with a built-in synth"
repository = "https://github.com/postmanpat-303/ChipWaveTracker"

[[bin]]
name = "chipwave"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "0.18"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
rfd = "0.17"
rtrb = "0.4"
mp3lame-encoder = "0.2.5"
id3 = "1.17"
midir = "0.11.1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
