format = "chipwave-patch"
version = 1
name = "Rolling Offbeat Bass"
author = "ChipWave factory"
tags = ["psytrance", "bass", "145bpm"]
# Classic rolling psy bass: play 3 sixteenths per beat (skip the kick 16th). Short filter env, key-tracked LP.

[osc1]
wave = "saw"
octave = -1
phase = "reset"
level = 0.9

[sub]
wave = "sine"
octave = -1
level = 0.35

[filter1]
model = "ladder"
mode = "lp24"
cutoff_hz = 180.0
resonance = 0.28
drive = 0.35
character = "warm"
key_track = 0.8
env_amount = 0.55

[env.amp]
attack_ms = 0
hold_ms = 0
decay_ms = 95
sustain = 0.0
release_ms = 25
curve = "exp"

[env.filter]
attack_ms = 0
decay_ms = 70
sustain = 0.0
release_ms = 20
curve = "exp"

[voice]
mode = "mono"
glide_ms = 0
legato = false

[macros]
macro1 = "Brightness"
macro2 = "Decay"

[[mod]]
source = "velocity"
target = "filter1.cutoff"
amount = 0.2

[[mod]]
source = "macro1"
target = "filter1.cutoff"
amount = 0.6

[[fx]]
type = "distortion"
mode = "soft"
drive = 0.15
mix = 1.0

[[fx]]
type = "compressor"
threshold_db = -14
ratio = 4.0
attack_ms = 1
release_ms = 60
makeup_db = 3
