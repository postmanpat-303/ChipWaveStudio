# cargo-deny: licence and advisory gate (run in CI: cargo deny check)
[graph]
all-features = false
# dev-dependencies (the egui_kittest UI test harness) are not shipped
exclude-dev = true

[advisories]
# RustSec database; vulnerabilities fail CI, unmaintained/unsound are reported
yanked = "warn"

[licenses]
# everything here is compatible with shipping a GPL-3.0-or-later binary
allow = [
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
